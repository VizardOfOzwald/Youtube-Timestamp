<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Timestamp Tools</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="logo" id="logo"></span>
    <div class="ht">
      <h1>Timestamp Tools</h1>
      <small>for YouTube</small>
    </div>
    <span class="ver">v1.1</span>
  </header>

  <section class="card">
    <div class="trow">
      <div>
        <b>Extension</b>
        <small>Master on/off for everything</small>
      </div>
      <label class="sw"><input type="checkbox" id="swExt"><i></i></label>
    </div>
    <div class="trow">
      <div>
        <b>Floating panel</b>
        <small>Show the controls on the video</small>
      </div>
      <label class="sw"><input type="checkbox" id="swPanel"><i></i></label>
    </div>
  </section>

  <section class="card hidden" id="videoBox">
    <div class="vtitle" id="vTitle"></div>
    <div class="vmeta" id="vMeta"></div>
    <button class="btn wide" id="btnOpen">Open panel on this video</button>
  </section>

  <section class="card hidden" id="hintBox">
    <div class="hint" id="hintText"></div>
  </section>

  <section class="row2">
    <button class="btn" id="btnExport"></button>
    <button class="btn" id="btnImport"></button>
  </section>
  <div class="status" id="status"></div>

  <footer>
    <span>Everything stays in your browser</span>
    <b id="totalSaved"></b>
  </footer>

  <input type="file" id="file" accept=".json,application/json" hidden>
  <script src="popup.js"></script>
</body>
</html>
